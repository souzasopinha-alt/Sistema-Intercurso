<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Intercursos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <section class="login">

            <h1>Entrar</h1>

            <p>
                Entre na sua conta do Intercursos.
            </p>


            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p id="mensagem"></p>


            <p class="link">

                Ainda não possui uma conta?

                <a href="cadastro.html">
                    Cadastre-se
                </a>

            </p>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
