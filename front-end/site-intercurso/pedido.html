<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Fardamento</title>
    <link rel="stylesheet" href="pedido.css">
</head>
<body>
    <div id="fundoTransicao" aria-hidden="true"></div>
    <div class="textura-transicao" aria-hidden="true"></div>

    <main class="container">
        <section id="etapaCurso" class="etapa ativa">
            <div class="formulario-container formulario-escolha">
                <div class="marca">FARDAMENTO • INTERCURSO</div>

                <div class="cabecalho">
                    <span class="numero-etapa">01</span>
                    <h1>Qual seu curso?</h1>
                    <p>Selecione seu curso para personalizar a identidade visual do pedido.</p>
                </div>

                <form id="formCurso">
                    <div class="opcoes-curso">
                        <div class="curso-opcao">
                            <input type="radio" id="cursoInformatica" name="curso" value="Informatica">
                            <label for="cursoInformatica">
                                <span class="curso-indice">01</span>
                                <span>
                                    <strong>Informática</strong>
                                    <small>Tecnologia e sistemas</small>
                                </span>
                                <span class="curso-seta">→</span>
                            </label>
                        </div>

                        <div class="curso-opcao">
                            <input type="radio" id="cursoContabilidade" name="curso" value="Contabilidade">
                            <label for="cursoContabilidade">
                                <span class="curso-indice">02</span>
                                <span>
                                    <strong>Contabilidade</strong>
                                    <small>Gestão e finanças</small>
                                </span>
                                <span class="curso-seta">→</span>
                            </label>
                        </div>

                        <div class="curso-opcao">
                            <input type="radio" id="cursoEnfermagem" name="curso" value="Enfermagem">
                            <label for="cursoEnfermagem">
                                <span class="curso-indice">03</span>
                                <span>
                                    <strong>Enfermagem</strong>
                                    <small>Saúde e cuidado</small>
                                </span>
                                <span class="curso-seta">→</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="botao">
                        <span>Continuar</span>
                        <span class="botao-icone">↗</span>
                    </button>
                </form>
            </div>
        </section>

        <section id="etapaPedido" class="etapa">
            <div class="formulario-container">
                <button type="button" id="btnVoltarCurso" class="btn-voltar" aria-label="Voltar para seleção do curso">
                    <span>←</span>
                    <small>Voltar</small>
                </button>

                <div class="marca">FARDAMENTO • INTERCURSO</div>

                <div class="cabecalho">
                    <span class="numero-etapa">02</span>
                    <h1>Pedido de Fardamento</h1>
                    <p>Preencha os dados para personalizar sua camisa.</p>
                </div>

                <form id="formPedido">
                    <div class="campo">
                        <label for="modelo">Curso / modelo</label>
                        <select id="modelo" name="modelo">
                            <option value="">Selecione o curso</option>
                            <option value="Informatica">Informática</option>
                            <option value="Contabilidade">Contabilidade</option>
                            <option value="Enfermagem">Enfermagem</option>
                        </select>
                        <span class="erro" id="erroModelo"></span>
                    </div>

                    <div class="linha-campos">
                        <div class="campo">
                            <label for="numero">Número</label>
                            <input type="number" id="numero" name="numero" min="1" max="99" placeholder="Ex.: 10">
                            <span class="erro" id="erroNumero"></span>
                        </div>

                        <div class="campo">
                            <label for="tamanho">Tamanho</label>
                            <select id="tamanho" name="tamanho">
                                <option value="">Selecione</option>
                                <option value="P">P</option>
                                <option value="M">M</option>
                                <option value="G">G</option>
                                <option value="GG">GG</option>
                                <option value="XG">XG</option>
                            </select>
                            <span class="erro" id="erroTamanho"></span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="nomeCostas">Nome nas costas</label>
                        <input type="text" id="nomeCostas" name="nomeCostas" maxlength="20" placeholder="Digite o nome">
                        <span class="erro" id="erroNome"></span>
                    </div>

                    <button type="submit" class="botao">
                        <span>Enviar pedido</span>
                        <span class="botao-icone">↗</span>
                    </button>

                    <div id="mensagemSucesso" class="sucesso"></div>
                </form>
            </div>
        </section>
    </main>

    <script src="pedido.js"></script>
</body>
</html>
