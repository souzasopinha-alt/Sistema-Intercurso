<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Intercursos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <section class="cadastro">

            <h1>Criar conta</h1>

            <p>
                Preencha os dados para realizar seu cadastro.
            </p>


            <form id="formCadastro">

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button type="submit">
                    Cadastrar
                </button>

            </form>


            <p id="mensagemCadastro"></p>


            <p class="link">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>


    <script src="cadastro.js"></script>

</body>

</html>
